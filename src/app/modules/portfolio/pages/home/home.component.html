<app-header/>

<main>
  <app-knowledge id="conhecimentos"/>
  <app-experiences id="experiencias"/>

  @defer(on viewport) {
    <app-projects id="projetos"/>
  }@placeholder {
    <section id="projetos" class="placeholder">
      <p>{{ i18n.t('projects.loading') }}</p>
    </section>
  } @error {
    <section class="placeholder">
      <p>{{ i18n.t('projects.error') }}</p>
    </section>
  }
</main>

<footer>
  <div class="container">
    <p>© {{ year }} Pedro Tostes · {{ i18n.t('footer.madeWith') }}</p>
    <a href="#inicio">{{ i18n.t('footer.backToTop') }}</a>
  </div>
</footer>
