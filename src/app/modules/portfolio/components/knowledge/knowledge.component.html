<div class="container">
  <div class="section-title">
    <span>{{ i18n.t('skills.eyebrow') }}</span>
    <h2>{{ i18n.t('skills.title') }}</h2>
  </div>

  <ul>
    @for(item of arrayKnowledge; track item.name) {
      <li>
        <img [src]="item.src" [alt]="i18n.t('skills.iconAlt') + ' ' + item.name" loading="lazy" width="28" height="28"/>
        <span>{{ item.name }}</span>
      </li>
    }
  </ul>
</div>
