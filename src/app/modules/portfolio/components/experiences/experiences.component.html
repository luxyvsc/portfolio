<div class="container">
  <div class="section-title">
    <span>{{ i18n.t('experience.eyebrow') }}</span>
    <h2>{{ i18n.t('experience.title') }}</h2>
  </div>

  <ol class="timeline">
    @for(item of arrayExperiences; track $index; let first = $first) {
      <li>
        <details [open]="first">
          <summary>
            <div>
              <strong>{{ item.summary.strong }}</strong>
              <small>{{ item.summary.p }}</small>
            </div>
          </summary>
          <article [innerHTML]="item.text"></article>
        </details>
      </li>
    }
  </ol>
</div>
